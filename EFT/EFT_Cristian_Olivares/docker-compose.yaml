services:

  # ==========================================
  # 1. INFRAESTRUCTURA DE MENSAJERÍA (KAFKA)
  # ==========================================
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # CAMBIO CLAVE: Usamos 'kafka' en lugar de 'localhost' para que otros contenedores puedan conectarse
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - banco-network

  # ==========================================
  # 2. INFRAESTRUCTURA DE MICROSERVICIOS
  # ==========================================
  eureka-server:
    build: ./eureka-server
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - banco-network

  config-server:
    build: ./config-server
    ports:
      - "8888:8888"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/bank-api/default > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - banco-network

  # ==========================================
  # 3. SEGURIDAD (OAUTH2)
  # ==========================================
  auth-server:
    build: ./auth-server
    ports:
      - "9000:9000"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - banco-network

  # ==========================================
  # 4. MICROSERVICIOS DE NEGOCIO
  # ==========================================
  bank-api:
    build: ./bank-api
    ports:
      - "8081:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      # Sobrescribimos la URL de Kafka para que use el contenedor y no localhost
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - banco-network

  cuentas-api:
    build: ./cuentas-api
    ports:
      - "8084:8082"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - banco-network

  intereses-api:
    build: ./intereses-api
    ports:
      - "8083:8083"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - banco-network

  batch-service:
    build: ./batch-service
    ports:
      - "8085"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - BATCH_INPUT_DIRECTORY=/app/data/legacy
      - BATCH_OUTPUT_DIRECTORY=/app/output
      - BATCH_DB_PATH=/app/state/batchdb
    volumes:
      - ./bank-api/src/main/resources/data/legacy:/app/data/legacy:ro
      - ./batch-service/output:/app/output
      - batch-state:/app/state
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - banco-network

  clientes-api:
    build: ./clientes-api
    ports:
      - "8086:8086"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - banco-network

  pagos-api:
    build: ./pagos-api
    ports:
      - "8087:8087"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - banco-network

  bff-web:
    build: ./bff-web
    ports:
      - "8091:8091"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      clientes-api:
        condition: service_started
      cuentas-api:
        condition: service_started
    networks:
      - banco-network

  bff-mobile:
    build: ./bff-mobile
    ports:
      - "8092:8092"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      clientes-api:
        condition: service_started
      cuentas-api:
        condition: service_started
    networks:
      - banco-network

  bff-atm:
    build: ./bff-atm
    ports:
      - "8093:8093"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:ActiveProcessorCount=2
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      cuentas-api:
        condition: service_started
      pagos-api:
        condition: service_started
    networks:
      - banco-network

# ==========================================
# 5. RED INTERNA
# ==========================================
networks:
  banco-network:
    driver: bridge

volumes:
  batch-state: