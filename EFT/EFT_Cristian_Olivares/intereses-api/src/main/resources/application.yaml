server:
  port: 8083

spring:
  application:
    name: intereses-api
  config:
    import: "optional:configserver:http://config-server:8888"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-server:9000

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true